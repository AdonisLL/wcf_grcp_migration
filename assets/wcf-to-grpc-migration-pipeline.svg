<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">WCF to gRPC migration pipeline</title>
  <desc id="desc">A five-stage GitHub Copilot workflow that discovers WCF code, resolves decisions, designs gRPC specifications, delivers changes in parallel, and verifies parity before retirement.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080b18"/>
      <stop offset="0.5" stop-color="#10142a"/>
      <stop offset="1" stop-color="#071a21"/>
    </linearGradient>
    <linearGradient id="legacy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a4c"/>
      <stop offset="1" stop-color="#e44d8f"/>
    </linearGradient>
    <linearGradient id="modern" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4de0c0"/>
      <stop offset="1" stop-color="#27a8ff"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8a4c"/>
      <stop offset="0.45" stop-color="#9b7bff"/>
      <stop offset="1" stop-color="#4de0c0"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#7d65ff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#7d65ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.38"/>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#c8d4ff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="760" rx="30" fill="url(#background)"/>
  <rect width="1600" height="760" rx="30" fill="url(#grid)"/>
  <ellipse cx="790" cy="370" rx="620" ry="410" fill="url(#glow)"/>

  <!-- Header -->
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="80" y="82" fill="#f7f8ff" font-size="42" font-weight="750">Modernize WCF to gRPC</text>
    <text x="80" y="120" fill="#aeb8dc" font-size="20">Evidence-first planning · gated execution · measurable parity</text>

    <g transform="translate(1290 48)">
      <rect width="230" height="72" rx="36" fill="#171d37" stroke="#6e75a8" stroke-opacity="0.55"/>
      <path d="M34 38l9-4 4-9 4 9 9 4-9 4-4 9-4-9-9-4zm26-17l4-2 2-4 2 4 4 2-4 2-2 4-2-4-4-2z" fill="#b89cff"/>
      <text x="82" y="34" fill="#f3efff" font-size="16" font-weight="700">GitHub Copilot</text>
      <text x="82" y="55" fill="#aeb8dc" font-size="13">agent workflow</text>
    </g>
  </g>

  <!-- Main flow line -->
  <path d="M250 360H1350" fill="none" stroke="#252b4b" stroke-width="18" stroke-linecap="round"/>
  <path d="M250 360H1350" fill="none" stroke="url(#flow)" stroke-width="6" stroke-linecap="round" filter="url(#softGlow)"/>

  <!-- WCF source -->
  <g transform="translate(70 232)" filter="url(#shadow)" font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect width="230" height="255" rx="28" fill="#16182d" stroke="#ff876a" stroke-opacity="0.65" stroke-width="2"/>
    <circle cx="115" cy="74" r="46" fill="url(#legacy)"/>
    <path d="M83 57l15 43 17-28 17 28 15-43" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="115" y="148" fill="#fff" font-size="30" font-weight="800" text-anchor="middle">WCF</text>
    <text x="115" y="178" fill="#b7bfdc" font-size="15" text-anchor="middle">contracts · bindings · SOAP</text>
    <g fill="#ffb895" font-size="13" text-anchor="middle">
      <text x="115" y="210">Legacy .NET estate</text>
      <text x="115" y="232">services + clients</text>
    </g>
  </g>

  <!-- gRPC destination -->
  <g transform="translate(1300 232)" filter="url(#shadow)" font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect width="230" height="255" rx="28" fill="#111d2b" stroke="#4de0c0" stroke-opacity="0.7" stroke-width="2"/>
    <circle cx="115" cy="74" r="46" fill="url(#modern)"/>
    <path d="M87 73h56M115 45v56M95 53l40 40M135 53L95 93" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
    <circle cx="115" cy="73" r="17" fill="#fff"/>
    <circle cx="115" cy="73" r="8" fill="#27b8c7"/>
    <text x="115" y="148" fill="#fff" font-size="30" font-weight="800" text-anchor="middle">gRPC</text>
    <text x="115" y="178" fill="#b7d9df" font-size="15" text-anchor="middle">Protobuf · HTTP/2 · ASP.NET</text>
    <g fill="#74ead2" font-size="13" text-anchor="middle">
      <text x="115" y="210">Modern service platform</text>
      <text x="115" y="232">verified before cutover</text>
    </g>
  </g>

  <!-- Stage cards -->
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <!-- Discover -->
    <g transform="translate(345 214)" filter="url(#shadow)">
      <rect width="165" height="292" rx="22" fill="#171a31" stroke="#fd8b71" stroke-opacity="0.48"/>
      <circle cx="82.5" cy="146" r="24" fill="#ff8268"/>
      <circle cx="74" cy="137" r="10" fill="none" stroke="#fff" stroke-width="4"/>
      <path d="M81 144l12 12" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
      <text x="82.5" y="42" fill="#ffb49d" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="2">01</text>
      <text x="82.5" y="72" fill="#fff" font-size="21" font-weight="750" text-anchor="middle">DISCOVER</text>
      <text x="82.5" y="103" fill="#9da8cf" font-size="13" text-anchor="middle">Read-only inventory</text>
      <g fill="#cbd1ea" font-size="12" text-anchor="middle">
        <text x="82.5" y="202">contracts</text>
        <text x="82.5" y="222">bindings</text>
        <text x="82.5" y="242">consumers</text>
        <text x="82.5" y="262">risk evidence</text>
      </g>
    </g>

    <!-- Decide -->
    <g transform="translate(535 214)" filter="url(#shadow)">
      <rect width="165" height="292" rx="22" fill="#171a31" stroke="#c77aff" stroke-opacity="0.5"/>
      <circle cx="82.5" cy="146" r="24" fill="#bd72f7"/>
      <path d="M70 137h25M70 146h18M70 155h12" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
      <text x="82.5" y="42" fill="#dbaaff" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="2">02</text>
      <text x="82.5" y="72" fill="#fff" font-size="21" font-weight="750" text-anchor="middle">DECIDE</text>
      <text x="82.5" y="103" fill="#9da8cf" font-size="13" text-anchor="middle">Targeted interview</text>
      <g fill="#cbd1ea" font-size="12" text-anchor="middle">
        <text x="82.5" y="202">unknowns only</text>
        <text x="82.5" y="222">security + hosting</text>
        <text x="82.5" y="242">redesign choices</text>
        <text x="82.5" y="262">decision log</text>
      </g>
    </g>

    <!-- Design -->
    <g transform="translate(725 190)" filter="url(#shadow)">
      <rect width="165" height="340" rx="22" fill="#1b1d3a" stroke="#8f7dff" stroke-width="2"/>
      <circle cx="82.5" cy="170" r="28" fill="#7869f5"/>
      <path d="M69 174l10-11 8 8 10-12M69 182h28" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="82.5" y="44" fill="#b8afff" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="2">03</text>
      <text x="82.5" y="76" fill="#fff" font-size="23" font-weight="800" text-anchor="middle">DESIGN</text>
      <text x="82.5" y="108" fill="#b4bcef" font-size="13" text-anchor="middle">Reviewable specs</text>
      <rect x="23" y="126" width="119" height="26" rx="13" fill="#282451"/>
      <text x="82.5" y="144" fill="#d9d4ff" font-size="11" font-weight="700" text-anchor="middle">HUMAN APPROVAL</text>
      <g fill="#d4d8f0" font-size="12" text-anchor="middle">
        <text x="82.5" y="235">Protobuf contracts</text>
        <text x="82.5" y="256">target architecture</text>
        <text x="82.5" y="277">dependency DAG</text>
        <text x="82.5" y="298">fleet-ready packages</text>
      </g>
    </g>

    <!-- Deliver -->
    <g transform="translate(915 214)" filter="url(#shadow)">
      <rect width="165" height="292" rx="22" fill="#151d34" stroke="#4da9ff" stroke-opacity="0.55"/>
      <circle cx="82.5" cy="146" r="24" fill="#358ee8"/>
      <path d="M68 137h10v10H68zm19 0h10v10H87zm-19 19h10v10H68zm19 0h10v10H87z" fill="#fff"/>
      <text x="82.5" y="42" fill="#8fc8ff" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="2">04</text>
      <text x="82.5" y="72" fill="#fff" font-size="21" font-weight="750" text-anchor="middle">DELIVER</text>
      <text x="82.5" y="103" fill="#9dbbd9" font-size="13" text-anchor="middle">Dependency-aware fleet</text>
      <g fill="#cbd9e8" font-size="12" text-anchor="middle">
        <text x="82.5" y="202">bounded ownership</text>
        <text x="82.5" y="222">parallel waves</text>
        <text x="82.5" y="242">issue publishing</text>
        <text x="82.5" y="262">checkpoints</text>
      </g>
    </g>

    <!-- Verify -->
    <g transform="translate(1105 214)" filter="url(#shadow)">
      <rect width="165" height="292" rx="22" fill="#121f31" stroke="#45d9c1" stroke-opacity="0.58"/>
      <circle cx="82.5" cy="146" r="24" fill="#2bc4ad"/>
      <path d="M69 147l9 9 18-21" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="82.5" y="42" fill="#89ebdc" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="2">05</text>
      <text x="82.5" y="72" fill="#fff" font-size="21" font-weight="750" text-anchor="middle">VERIFY</text>
      <text x="82.5" y="103" fill="#9dcac5" font-size="13" text-anchor="middle">Independent parity</text>
      <g fill="#c7dfdc" font-size="12" text-anchor="middle">
        <text x="82.5" y="202">behavior + faults</text>
        <text x="82.5" y="222">security + streaming</text>
        <text x="82.5" y="242">operational proof</text>
        <text x="82.5" y="262">retirement gate</text>
      </g>
    </g>
  </g>

  <!-- Direction arrows -->
  <g fill="#d6dcff">
    <path d="M321 353l13 7-13 7z"/>
    <path d="M511 353l13 7-13 7z"/>
    <path d="M701 353l13 7-13 7z"/>
    <path d="M891 353l13 7-13 7z"/>
    <path d="M1081 353l13 7-13 7z"/>
    <path d="M1271 353l13 7-13 7z"/>
  </g>

  <!-- Safety rail -->
  <g transform="translate(315 590)" font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect width="970" height="105" rx="24" fill="#11162b" stroke="#48517e" stroke-opacity="0.7"/>
    <text x="34" y="34" fill="#8e9bc9" font-size="12" font-weight="800" letter-spacing="2">SAFETY RAILS</text>

    <g transform="translate(34 53)">
      <g>
        <circle cx="10" cy="10" r="10" fill="#7b68ee"/>
        <path d="M6 10l3 3 6-7" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
        <text x="28" y="15" fill="#d5daf0" font-size="14">Evidence, not guesses</text>
      </g>
      <g transform="translate(230 0)">
        <circle cx="10" cy="10" r="10" fill="#b56df1"/>
        <path d="M6 10l3 3 6-7" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
        <text x="28" y="15" fill="#d5daf0" font-size="14">Explicit approval gates</text>
      </g>
      <g transform="translate(472 0)">
        <circle cx="10" cy="10" r="10" fill="#398fdf"/>
        <path d="M6 10l3 3 6-7" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
        <text x="28" y="15" fill="#d5daf0" font-size="14">Traceable work packages</text>
      </g>
      <g transform="translate(730 0)">
        <circle cx="10" cy="10" r="10" fill="#26bea8"/>
        <path d="M6 10l3 3 6-7" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
        <text x="28" y="15" fill="#d5daf0" font-size="14">No retirement without proof</text>
      </g>
    </g>
  </g>

  <text x="800" y="730" fill="#6f789f" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle">
    5 specialized agents · 7 reusable skills · schemas, fixtures, CI, and resumable orchestration
  </text>
</svg>
